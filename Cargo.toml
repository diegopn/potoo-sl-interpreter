[package]
name = "potoo-sl-interpreter"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"
repository = "https://github.com/diegopn/potoo-sl-interpreter"
homepage = "https://diegopn.github.io/potoo-site/manual/sl/"
readme = "README.md"
description = "A host-driven interpreter for a documented subset of the Spanish SL educational language."

[lib]
name = "potoo_sl_interpreter"
path = "src/lib.rs"

[[bin]]
name = "potoo-sl"
path = "src/bin/potoo-sl.rs"
